name: Lint

on:
    push:
        branches:
            - "*"
    pull_request:
        branches:
            - "*"

jobs:
    run-linters:
        name: Run linters
        runs-on: ubuntu-latest

        steps:
            - name: Check out Git repository
              uses: actions/checkout@v6

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24

            - uses: pnpm/action-setup@v4
              with:
                  version: 10

            - name: Install Node.js dependencies
              run: pnpm install

            - name: Run linters
              run: pnpm run lint
